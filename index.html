<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Китайский с героем</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<!-- Hanzi Writer: анимация порядка черт и проверка письма (нужен интернет; без него — обычные прописи) -->
<script async src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
<style>
:root{
  --bg:#fff6e8; --card:#ffffff; --ink:#2b2350; --muted:#7a7396; --line:#eee3d0;
  --primary:#ff7a45; --primary-d:#e85f2a; --violet:#7c5cff; --green:#22b573; --red:#ef4a5a; --gold:#ffb703;
  --t1:#e53935; --t2:#f28c00; --t3:#1f9d55; --t4:#2f6fe4; --t0:#8a8a9a;
  --r:22px; --shadow:0 6px 0 rgba(43,35,80,.08), 0 10px 24px rgba(43,35,80,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;font-weight:700;min-height:100vh;
  background-image:radial-gradient(circle at 10% 0%,#ffe3c4 0,transparent 40%),radial-gradient(circle at 100% 30%,#e9e2ff 0,transparent 35%);}
.zh{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;font-weight:600}
.kai{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC",serif}
#app{max-width:760px;margin:0 auto;padding:16px 16px 60px}
button{font:inherit;color:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-weight:900}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.cen{justify-content:center}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:24px}

.btn{background:var(--primary);color:#fff;border-radius:18px;padding:14px 22px;font-size:20px;font-weight:900;box-shadow:0 5px 0 var(--primary-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-d)}
.btn.big{width:100%;font-size:26px;padding:20px}
.btn.violet{background:var(--violet);box-shadow:0 5px 0 #5b3fd9}
.btn.green{background:var(--green);box-shadow:0 5px 0 #178a56}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{opacity:.45}
.icon-btn{background:#fff;border-radius:14px;padding:8px 12px;font-size:18px;box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.linkbtn{background:none;color:var(--muted);text-decoration:underline;font-size:15px}

.topbar{display:flex;gap:8px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:8px 12px;box-shadow:var(--shadow);font-size:16px;white-space:nowrap}

/* HERO */
.hero-card{text-align:center;position:relative;overflow:hidden}
.scene{position:relative;border-radius:24px;margin:8px 0 0;overflow:hidden}
.scene .deco{position:absolute;font-size:44px;opacity:.85}
.scene .deco.a{left:10px;bottom:6px}.scene .deco.b{right:12px;top:8px;font-size:34px}
.hero-stage{position:relative;width:220px;height:220px;margin:6px auto 0}
.aura{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 70%);opacity:calc(.15 + var(--en) * .55);animation:pulse 2.4s ease-in-out infinite}
.aura.rainbow{background:conic-gradient(#ff4d4d,#ffb703,#22b573,#38bdf8,#a855f7,#ff4d4d);filter:blur(22px)}
.ring{position:absolute;border-radius:50%;border:3px dashed var(--c);opacity:.35;animation:spin 18s linear infinite}
.hero-emoji{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;line-height:1;filter:saturate(calc(.25 + var(--en)*.75))}
.mood-top .hero-emoji{animation:bounce 1.2s ease-in-out infinite}
.mood-ok .hero-emoji{animation:bounce 2.4s ease-in-out infinite}
.mood-sleep .hero-emoji{transform:rotate(-8deg);opacity:.75}
.zzz{position:absolute;right:18px;top:10px;font-size:34px;animation:float 2s ease-in-out infinite}
.pet{position:absolute;right:-18px;bottom:0;font-size:54px;animation:bounce 1.7s ease-in-out infinite}
.orbit{position:absolute;inset:0;animation:spin 30s linear infinite}
.orbit span{position:absolute;left:50%;top:50%;font-size:30px;margin:-17px 0 0 -17px}
.orbit span i{display:inline-block;font-style:normal;animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes bounce{50%{transform:translateY(-10px)}}
@keyframes float{50%{transform:translateY(-8px)}}
.bubble{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-top:6px;font-size:17px;max-width:95%}
.bar{height:16px;background:#f1eadc;border-radius:999px;overflow:hidden}
.bar>div{height:100%;border-radius:999px;transition:width .6s}
.bar.thin{height:10px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#faf6ee;border-radius:14px;padding:8px}
.stat b{display:block;font-size:22px}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px}
.tile{background:#fff;border-radius:20px;padding:16px 10px;box-shadow:var(--shadow);text-align:center;font-size:18px}
.tile .e{font-size:40px;display:block;margin-bottom:4px}
.tile:active{transform:scale(.97)}

/* quests */
.quest{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;margin-top:10px}
.quest .qe{font-size:26px}
.quest.done{opacity:.7}
.chest{font-size:90px;animation:bounce 1s ease-in-out infinite}

/* choose hero */
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hero-pick{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);border:4px solid transparent;text-align:center}
.hero-pick.sel{border-color:var(--primary)}
.hero-pick .e{font-size:56px}
.evo{font-size:22px;letter-spacing:2px;margin-top:4px}
.hero-pick.gta{position:relative;overflow:hidden;padding:0 0 12px}
.hero-pick.gta.sel{border-color:var(--c)}
.pv{position:relative;height:110px;display:grid;place-items:center;overflow:hidden;margin-bottom:8px}
.pv::before{content:'';position:absolute;inset:-24px;background:radial-gradient(circle at 50% 45%,#fff8 0,transparent 45%),linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));filter:blur(14px);opacity:.85}
.pv .e{position:relative;font-size:64px;filter:blur(1.6px) drop-shadow(0 4px 10px #0005);transition:filter .3s,transform .3s}
.hero-pick.gta:hover .pv .e,.hero-pick.gta.sel .pv .e{filter:blur(.5px) drop-shadow(0 4px 10px #0005);transform:scale(1.06)}
.pv .tag{position:absolute;left:8px;bottom:6px;font-size:12px;color:#fff;background:#0006;border-radius:8px;padding:2px 8px;backdrop-filter:blur(4px)}
.hero-card.tinted::before{content:'';position:absolute;inset:-40px -40px auto;height:320px;background:radial-gradient(circle at 50% 50%,var(--c),transparent 65%);filter:blur(30px);opacity:.45;pointer-events:none}
.hero-card.tinted>*{position:relative}
input[type=text],input[type=number]{font:inherit;font-size:22px;padding:12px 16px;border-radius:16px;border:3px solid var(--line);width:100%;background:#fff;color:var(--ink)}

/* battle */
.battle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.battle .h,.battle .m{font-size:42px;transition:transform .25s}
.battle .m.boss{font-size:58px}
.battle .h.hit{transform:translateX(24px) scale(1.2)}
.battle .m.hurt{animation:hurt .4s}
@keyframes hurt{25%{transform:translateX(8px) rotate(10deg);filter:brightness(2)}75%{transform:translateX(-6px)}}
.hp{flex:1}
.hp .bar>div{background:linear-gradient(90deg,#ff5f6d,#ffc371)}
.combo{display:inline-block;background:linear-gradient(90deg,#ff7a45,#ff3d6e);color:#fff;border-radius:999px;padding:2px 10px;font-size:15px;animation:pulse 1s infinite}
.task{text-align:center}
.big-hz{font-size:96px;line-height:1.15}
.pinyin{font-size:30px;font-weight:800}
.ru-tr{font-size:18px;color:var(--muted)}
.emoji-xl{font-size:80px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.options.one{grid-template-columns:1fr}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 8px;font-size:20px;min-height:96px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.options.one .opt{min-height:60px}
.opt .oe{font-size:44px}
.opt .ohz{font-size:48px}
.opt.right{background:#dcfce7;border-color:var(--green)}
.opt.wrongc{background:#ffe4e6;border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:16px;border-radius:20px;padding:14px;font-size:20px}
.feedback.ok{background:#dcfce7;color:#11643f}
.feedback.no{background:#fff1e6;color:#8a3b12}
.speak{font-size:34px;background:var(--violet);color:#fff;border-radius:50%;width:84px;height:84px;box-shadow:0 5px 0 #5b3fd9}
.speak.mic{background:var(--primary);box-shadow:0 5px 0 var(--primary-d);width:104px;height:104px;font-size:44px}
.speak.mic.on{background:var(--red);animation:pulse .8s infinite}
.tip{background:#fff7d6;border-radius:16px;padding:10px 14px;margin-top:12px;font-size:17px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.match .col{display:grid;gap:10px}
.mi{background:#fff;border:3px solid var(--line);border-radius:18px;min-height:78px;font-size:40px;box-shadow:0 4px 0 var(--line)}
.mi.sel{border-color:var(--violet);background:#efe9ff}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .35s;border-color:var(--red)}

/* build sentence */
.ans{min-height:84px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;padding:10px 0;margin-top:14px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.tl{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 14px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center}
.tl .zh{font-size:32px;line-height:1.2}
.tl small{font-size:13px;color:var(--muted)}
.tl.used{visibility:hidden}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;font-size:18px;z-index:10;box-shadow:var(--shadow);animation:drop .3s;max-width:92vw;text-align:center}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
.confetti i{position:absolute;top:-20px;font-style:normal;font-size:26px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* tones */
.tones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tone{border-radius:18px;padding:12px;color:#fff;text-align:left;font-size:16px}
.tone b{font-size:26px;display:block}
.tone.c1{background:var(--t1)}.tone.c2{background:var(--t2)}.tone.c3{background:var(--t3)}.tone.c4{background:var(--t4)}

/* writing */
.pad{position:relative;width:min(320px,86vw);aspect-ratio:1;margin:12px auto;background:#fffdf8;border:4px solid #e7b9a4;border-radius:12px;touch-action:none}
.pad svg.grid{position:absolute;inset:0;width:100%;height:100%}
.pad #hw{position:absolute;inset:0}
.trace{position:absolute;inset:0;display:grid;place-items:center;font-size:min(250px,68vw);color:#000;opacity:.12;line-height:1;pointer-events:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 12px;font-size:28px}
.chip.sel{border-color:var(--primary);background:#fff0e8}

/* map */
.path{position:relative;display:flex;flex-direction:column;gap:18px;padding:10px 0}
.path::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:6px dotted #e6d6bb;transform:translateX(-50%)}
.node-row{display:flex;position:relative}
.node{position:relative;width:62%;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;border:4px solid transparent}
.node .ic{font-size:40px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#faf6ee;flex:none}
.node.cur{border-color:var(--primary)}
.node.done .ic{background:#dcfce7}
.node.lock{opacity:.5;filter:grayscale(.6)}
.node.boss .ic{background:#ffe4e6}
.node.boss.done .ic{background:#fef3c7}
.here{position:absolute;top:-16px;font-size:34px;animation:bounce 1.2s infinite}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.item{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow);border:3px solid transparent}
.item.on{border-color:var(--green)}
.item .e{font-size:48px}
.item .btn{padding:8px 14px;font-size:16px;margin-top:6px}

/* stories */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{font-size:40px;flex:none}
.msg .bb{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.msg.me .bb{background:#efe9ff}
.msg .bb .zh{font-size:28px}
.msg details{font-size:14px;color:var(--muted)}
.msg summary{font-size:13px}

/* dictionary */
.unit{margin-top:14px}
.unit.locked{opacity:.5}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.w{background:#faf6ee;border-radius:16px;padding:10px;text-align:center}
.w .hz{font-size:34px}
.stars{color:var(--gold);letter-spacing:1px}

.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach .a{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.ach .a.off{filter:grayscale(1);opacity:.45}
.ach .a .e{font-size:44px}

.chart{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.chart div{flex:1;background:var(--violet);border-radius:6px 6px 0 0;min-height:3px;position:relative}
.chart div.zero{background:#e6def7}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
details{margin-top:10px}
summary{cursor:pointer}
label.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
/* легендарные эволюции */
.legend1 .hero-emoji{filter:drop-shadow(0 0 14px #ffc233) drop-shadow(0 0 4px #fff)}
.legend2 .hero-emoji{filter:drop-shadow(0 0 16px #a855f7) drop-shadow(0 0 6px #38bdf8)}
.legend2 .aura{background:conic-gradient(#ff4d4d,#ffb703,#22b573,#38bdf8,#a855f7,#ff4d4d);filter:blur(20px);animation:spin 6s linear infinite}
.legend3 .hero-emoji{filter:drop-shadow(0 0 18px #6366f1) drop-shadow(0 0 8px #fff)}
.legend3 .aura{background:radial-gradient(circle,#fff 0 2%,transparent 3%) 0 0/22px 22px,radial-gradient(circle,#6366f1,#0b1026 70%,transparent 72%);opacity:.9}
.mstars{position:absolute;left:0;right:0;top:-6px;text-align:center;font-size:18px;z-index:2}
.hsk{display:inline-block;background:var(--violet);color:#fff;border-radius:8px;padding:0 6px;font-size:12px;vertical-align:middle}
.item.rare{background:linear-gradient(180deg,#fff8e1,#fff)}
.event{background:linear-gradient(135deg,#fff1d6,#ffe1e1);border:3px solid #ffcf70}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.check .st{font-size:24px;flex:none}
@media (max-width:420px){.big-hz{font-size:76px}.hero-stage{width:190px;height:190px}.hero-emoji{font-size:92px}.node{width:80%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   ДАННЫЕ
   ========================================================= */
const UNITS = [
  {id:'hi',   name:'Привет!',            icon:'👋'},
  {id:'num',  name:'Числа 1–10',         icon:'🔢'},
  {id:'pic',  name:'Иероглифы-картинки', icon:'🏞️'},
  {id:'fam',  name:'Семья',              icon:'👨‍👩‍👧'},
  {id:'ani',  name:'Животные',           icon:'🐼'},
  {id:'col',  name:'Цвета',              icon:'🎨'},
  {id:'food', name:'Еда',                icon:'🍜'},
  {id:'body', name:'Тело и действия',    icon:'✋'},
  {id:'talk', name:'Разговор',           icon:'💬'},
  // Курс HSK 1–2 (официальный экзамен по китайскому)
  {id:'num2',   name:'Счёт и возраст',  icon:'💯', hsk:1},
  {id:'time',   name:'Время и дни',     icon:'⏰', hsk:1},
  {id:'school', name:'Школа',           icon:'🏫', hsk:1},
  {id:'quest',  name:'Вопросы',         icon:'❔', hsk:1},
  {id:'verbs',  name:'Важные действия', icon:'🏃', hsk:1},
  {id:'weather',name:'Погода',          icon:'🌦️', hsk:1},
  {id:'places', name:'Город',           icon:'🏙️', hsk:1},
  {id:'trans',  name:'Транспорт',       icon:'🚆', hsk:2},
  {id:'clothes',name:'Одежда',          icon:'👕', hsk:2},
  {id:'feel',   name:'Чувства и оценки',icon:'😄', hsk:2},
  {id:'home',   name:'Вещи дома',       icon:'💻', hsk:2},
  {id:'people', name:'Люди и профессии',icon:'🧑‍⚕️', hsk:2},
];
// Названия мест на карте: для героев GTA — районы Лос-Сантоса, для остальных — Китай
const PLACES_CN = ['Пекин','Великая стена','Шанхай','Сиань','Чэнду','Гуйлинь','Гонконг','Харбин','Гора Хуаншань',
  'Ханчжоу','Сучжоу','Нанкин','Циндао','Ухань','Чунцин','Гуанчжоу','Шэньчжэнь','Куньмин','Лхаса','Далянь','Остров Хайнань'];
const PLACES_LS = ['Гроув-стрит','Вайнвуд','Веспуччи-Бич','Даунтаун','Дель-Перро','Сэнди-Шорс','Палето-Бэй','Порт Лос-Сантоса','Гора Чилиад',
  'Аэропорт Лос-Сантоса','Пирс Дель-Перро','Обсерватория','Рокфорд-Хиллз','Мирор-Парк','Ла-Пуэрта','Ричман','Пустыня Гранд-Сенора','Аламо-Си','Каньон Рэтон','Форт Занкудо','Маунт-Гордо'];
const BOSSES = [['👹','Они-Путаник'],['🐲','Дракон Забвения'],['🦖','Ти-Рекс Лени'],['🧌','Тролль Ошибок'],['🦑','Кракен Скуки'],['🤖','Мега-Бот'],['🐺','Волк Тишины'],['🧙','Колдун Тонов'],['👺','Император Забывания'],
  ['🐉','Нефритовый Дракон'],['🦂','Скорпион Пустыни'],['🐍','Змей Путаницы'],['🦈','Акула Забвения'],['🕷️','Паук Лени'],['🦇','Нетопырь Тишины'],['🐊','Крокодил Ошибок'],['👻','Призрак Тонов'],['🧛','Вампир Времени'],['🦍','Горилла Скуки'],['🐗','Кабан Хаоса'],['🌋','Лорд Вулкана']];

// h – иероглифы, p – пиньинь (слоги через пробел), r – русская транскрипция, tip – подсказка-история

/* Объединение двух прогрессов (например, старый герой + новый): ничего не теряется */
function mergeState(a,b){
  if(!hasProgress(a)) return normalize(b);
  if(!hasProgress(b)) return a;
  a=normalize(a); b=normalize(b);
  const m=normalize(a), sum=k=>(a[k]||0)+(b[k]||0);
  ['xp','coins','sessions','perfect','toneCorrect','writeCount','speakCount','buildCount','toneWord','memWrite'].forEach(k=>m[k]=sum(k));
  m.energy=Math.max(a.energy,b.energy); m.bestStreak=Math.max(a.bestStreak,b.bestStreak); m.maxCombo=Math.max(a.maxCombo||0,b.maxCombo||0);
  m.freezes=Math.min(2,Math.max(a.freezes||0,b.freezes||0));
  const later=(b.lastSessionDay||'')>(a.lastSessionDay||'')?b:a, earlier=later===a?b:a;
  m.lastSessionDay=later.lastSessionDay; m.streak=later.streak;
  // серии стыкуются: старый герой занимался до вчера, новый — с сегодня → это одна непрерывная серия
  if(later.lastSessionDay&&earlier.lastSessionDay&&later.streak>0&&earlier.lastSessionDay===addDays(later.lastSessionDay,-later.streak)) m.streak+=earlier.streak;
  m.bestStreak=Math.max(m.bestStreak,m.streak);
  m.words={...a.words};
  Object.entries(b.words||{}).forEach(([id,r])=>{ const x=m.words[id]; m.words[id]=!x?r:{box:Math.max(x.box,r.box),due:x.box>=r.box?x.due:r.due,c:x.c+r.c,w:x.w+r.w}; });
  m.days={...a.days};
  Object.entries(b.days||{}).forEach(([d,r])=>{ const x=m.days[d]; m.days[d]=!x?r:Object.fromEntries(Object.keys({...x,...r}).map(k=>[k,(x[k]||0)+(r[k]||0)])); });
  const uni=(x,y)=>[...new Set([...(x||[]),...(y||[])])];
  m.ach=uni(a.ach,b.ach); m.owned=uni(a.owned,b.owned);
  m.bosses={...b.bosses,...a.bosses}; m.stories={...b.stories,...a.stories}; m.events={...b.events,...a.events};
  m.oldHeroes=uni(a.oldHeroes,[...(b.oldHeroes||[]),b.heroId]).filter(h=>h&&h!==m.heroId);
  return m;
}
/* Перенос из «файловой» версии (file://) на localhost одним кликом: данные едут в адресе после #, на сервер не уходят */
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));

async function syncOnStart(){

/* даты */
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function dayRec(){ const d=today(); return state.days[d] ||= {xp:0,sessions:0,correct:0,wrong:0,min:0}; }

/* Дисциплина: пропуск дня — герой устаёт. Заморозка серии спасает. Уровни и предметы не отнимаются. */
function applyDecay(){
  const t=today();
  if(state.decayDay===t || !state.lastSessionDay){ state.decayDay=t; return; }
  const gap=diffDays(state.lastSessionDay,t);
  if(gap>=2){
    const missed=gap-1, use=Math.min(state.freezes,missed), left=missed-use;
    state.freezes-=use;
    if(left===0){
      state.lastSessionDay=addDays(t,-1);
      state.msg=`❄️ Заморозка спасла твою серию! ${state.heroName} не устал. Осталось заморозок: ${state.freezes}.`;
    } else {
      state.energy=Math.max(5,state.energy-20*left);
      if(state.streak>0) state.msg=`Пропущено ${missed} ${plural(missed,'день','дня','дней')}${use?` (заморозок хватило только на ${use})`:''}, и ${state.heroName} заскучал 😴 Серия сброшена. Один урок — и герой снова бодрый!`;
      state.streak=0;
    }
  }
  state.decayDay=t; save();
}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}

function autoStep(){ const n=learnedCount(); return n<30?1:n<70?2:n<120?3:4; }

const boxOf=w=>(state.words[w.id]||{}).box||0;
const showTr=w=>step()<=1||boxOf(w)<1;                       // русская транскрипция [ни хао]

/* тоны: варианты пиньиня с неправильным тоном (gǒu → góu, gòu, gōu) */
const TV={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',ü:'ǖǘǚǜ'};
const TBASE={}; Object.entries(TV).forEach(([b,v])=>[...v].forEach((c,i)=>TBASE[c]=b));
const setTone=(syl,t)=>[...syl].map(c=>TBASE[c]?TV[TBASE[c]][t-1]:c).join('');
function toneVariants(p){
  const syl=p.split(' '), idx=syl.map((x,i)=>toneOf(x)?i:-1).filter(i=>i>=0);
  if(!idx.length) return null;
  const out=new Set(); let n=0;
  while(out.size<3&&n++<60){ const c=[...syl], i=rnd(idx), cur=toneOf(c[i]); c[i]=setTone(c[i],rnd([1,2,3,4].filter(x=>x!==cur))); const v=c.join(' '); if(v!==p) out.add(v); }
  return out.size>=3?[...out]:null;
}
/* «вставь пропущенное слово» во фразу */
function fillTask(s){
  const idx=s.t.map((h,i)=>WBH[h]?i:-1).filter(i=>i>=0); if(!idx.length) return null;
  const bi=rnd(idx), right=s.t[bi];
  const pool=shuffle(COURSE.filter(w=>state.words[w.id]&&!s.t.includes(w.h)).map(w=>w.h)).slice(0,3);
  if(pool.length<3) return null;
  const opts=shuffle([right,...pool]);
  return {type:'fill',s,bi,opts,ans:opts.indexOf(right)};
}

function ensureQuest(){
  const t=today();
  if(state.quest && state.quest.day===t) return state.quest;
  const pool=shuffle(Object.keys(QUESTS).filter(k=>k!=='lesson'&&(!QUESTS[k].ok||QUESTS[k].ok())));
  state.quest={day:t,ids:['lesson',...pool.slice(0,2)],prog:{},claimed:false};
  save(); return state.quest;
}
function questAdd(key,n,max){
  if(!state.heroId) return;
  const q=ensureQuest(); if(!q.ids.includes(key)) return;
  const before=q.prog[key]||0, goal=QUESTS[key].goal;
  q.prog[key]=max?Math.max(before,n):before+n;
  if(before<goal && q.prog[key]>=goal) setTimeout(()=>toast(`✅ Задание выполнено: ${QUESTS[key].e} ${QUESTS[key].n}`),700);
}
const questsDone=q=>q.ids.every(k=>(q.prog[k]||0)>=QUESTS[k].goal);
function openChest(){
  const q=ensureQuest(); if(q.claimed||!questsDone(q)) return;

function pickVoice(){ const vs=speechSynthesis.getVoices(); zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/Tingting|Ting-Ting|Xiaoxiao|Google/i.test(v.name))||vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null; }

function say(text,rate){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean=String(text).replace(/\{name\}/g,'').replace(/[A-Za-zА-Яа-яЁё…]/g,'');
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='zh-CN'; if(zhVoice) u.voice=zhVoice; u.rate=rate||state.settings.rate;

function listen(cb){
  const r=new SR(); r.lang='zh-CN'; r.interimResults=false; r.maxAlternatives=5;
  let done=false;
  r.onresult=e=>{done=true;cb([...e.results[0]].map(a=>a.transcript));};
  r.onerror=e=>{done=true;cb(null,e.error);};
  r.onend=()=>{ if(!done) cb(null,'no-speech'); };

  return r;
}
let ac;
function beep(notes){
  try{ ac ||= new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach(([f,t,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);
      const s=ac.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.18,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.05);});
  }catch(e){}
}

let S=null, HW=null;
const unitWords=i=>WORDS.filter(w=>w.u===UNITS[i].id);
function unitReady(i){ const ws=unitWords(i), recs=ws.map(w=>state.words[w.id]);
  return !!state.bosses[UNITS[i].id] || (recs.every(Boolean) && recs.filter(r=>r.box>=2).length>=Math.ceil(ws.length/2)); }
const unitSeen=i=>unitWords(i).every(w=>state.words[w.id]);
function openUnits(){ if(state.settings.allOpen) return UNITS.length; let n=1; for(let i=0;i<UNITS.length-1;i++){ if(unitReady(i)) n=i+2; else break; } return n; }
function openWords(){ const ids=UNITS.slice(0,openUnits()).map(u=>u.id); return WORDS.filter(w=>ids.includes(w.u)); }
const readySentences=()=>SENTENCES.filter(s=>s.t.every(t=>EXTRA[t]||(WBH[t]&&state.words[WBH[t].id])));
function distractors(w,n,key){
  const pool=openWords().concat(WORDS.filter(x=>x.u===w.u));
  const seen=new Set([w[key]]), out=[];
  for(const x of shuffle(pool.filter(x=>x.u===w.u)).concat(shuffle(pool))){ if(out.length>=n) break; if(!seen.has(x[key])&&x.e!==w.e){ seen.add(x[key]); out.push(x);} }
  return out;
}
function quizType(w,firstTime){ const box=boxOf(w), st=step();
  if(firstTime) return rnd(['listen','meaning']);
  const t=['listen','meaning','hanzi'];
  if(st>=2&&box>=2){ t.push('listenHanzi'); if(toneVariants(w.p)) t.push('tone','tone'); }
  if(st>=3&&box>=2) t.push('listenHanzi','hanzi');
  return rnd(t); }
function pickMatch(pool){ const out=[],es=new Set(); shuffle(pool).forEach(w=>{ if(!es.has(w.e)&&out.length<4){es.add(w.e);out.push(w);} }); return out.length>=3?{type:'match',ws:out}:null; }
function writeTask(pool){ if(!window.HanziWriter) return null; const w=shuffle(pool).find(w=>[...w.h].length===1); return w?{type:'write',w}:null; }
// На 3–4 ступени — написать хорошо знакомый иероглиф по памяти, без контура
function memoryTask(){ if(!window.HanziWriter||step()<3) return null; const w=shuffle(COURSE.filter(w=>[...w.h].length===1&&boxOf(w)>=3))[0]; return w?{type:'write',w,mem:true}:null; }

function startSession(mode='lesson',unitIdx){
  const t=today(); let tasks=[], monster=rnd(MONSTERS);
  if(mode==='mistakes'){
    const ws=weakWords().sort((a,b)=>(state.words[b.id].w-state.words[b.id].c)-(state.words[a.id].w-state.words[a.id].c)).slice(0,8);
    if(!ws.length){ toast('Ошибок нет — ты молодец! 🎉'); return; }
    ws.forEach(w=>tasks.push({type:rnd(['meaning','hanzi','listen']),w}));
    const m=pickMatch(ws); if(m) tasks.splice(Math.min(3,tasks.length),0,m);
    ws.slice(0,3).forEach(w=>tasks.push({type:rnd(['meaning','hanzi','listen']),w}));
    monster=['🩹','Монстр Ошибок'];
  } else if(mode==='boss'){
    const ws=shuffle(unitWords(unitIdx));
    ws.forEach(w=>tasks.push({type:rnd(['listen','meaning','hanzi']),w}));
    const m=pickMatch(ws); if(m) tasks.splice(Math.floor(tasks.length/2),0,m);
    const snt=shuffle(readySentences().filter(s=>s.t.some(x=>WBH[x]&&WBH[x].u===UNITS[unitIdx].id)))[0]; if(snt) tasks.push({type:'build',s:snt});
    monster=BOSSES[unitIdx];
  } else if(mode==='event'){
    const ev=activeEvent(); if(!ev) return;
    const ws=eventWords(ev), fresh=ws.filter(w=>!state.words[w.id]).slice(0,4), seen=ws.filter(w=>state.words[w.id]);
    fresh.forEach(w=>tasks.push({type:'learn',w})); fresh.forEach(w=>tasks.push({type:quizType(w,true),w}));
    seen.forEach(w=>tasks.push({type:rnd(['listen','meaning','hanzi']),w}));

    fresh.forEach(w=>tasks.push({type:rnd(['hanzi','listen']),w}));
    monster=[ev.e,'Праздничный дракон'];

    let rev=Object.entries(state.words).filter(([,r])=>r.due<=t).sort((a,b)=>a[1].box-b[1].box||a[1].due.localeCompare(b[1].due)).slice(0,6).map(([id])=>WBY[id]);
    if(fresh.length+rev.length<5){ const extra=shuffle(Object.keys(state.words).map(id=>WBY[id]).filter(w=>!rev.includes(w))).slice(0,6-fresh.length-rev.length); rev=rev.concat(extra); }
    if(!fresh.length && !rev.length){ toast('Все слова выучены! 🎉 Попроси взрослых открыть новые темы.'); return; }
    const revQ=[...rev];
    for(let i=0;i<fresh.length;i+=2){
      const pair=fresh.slice(i,i+2);
      pair.forEach(w=>tasks.push({type:'learn',w}));
      pair.forEach(w=>tasks.push({type:quizType(w,true),w}));

let micReady=false;
async function ensureMic(){
  if(micReady) return true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return true;
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t=>t.stop()); micReady=true; return true; }
  catch(e){ return e.name||'error'; }
}

/* сборка фраз */
function renderBuild(){
  const tile=(o,fn,used)=>`<button class="tl ${used?'used':''}" onclick="${fn}('${o.k}')"><span class="zh">${o.h}</span><small>${pyOf(o.h)}</small></button>`;
  $('#ans').innerHTML=S.b.chosen.map(k=>tile(S.b.tiles.find(o=>o.k===k),'buildUn')).join('')||'<span class="muted small">Нажимай на плитки внизу</span>';
  $('#bank').innerHTML=S.b.tiles.map(o=>tile(o,'buildAdd',S.b.chosen.includes(o.k))).join('');
  $('#chk').disabled=!S.b.chosen.length;
}
function buildAdd(k){ if(S.b.chosen.includes(k)||S.b.locked) return; S.b.chosen.push(k); say(S.b.tiles.find(o=>o.k===k).h); renderBuild(); }
function buildUn(k){ if(S.b.locked) return; S.b.chosen=S.b.chosen.filter(x=>x!==k); renderBuild(); }
function buildCheck(){
  const s=S.tasks[S.i].s, got=S.b.chosen.map(k=>S.b.tiles.find(o=>o.k===k).h).join(''), want=s.t.join('');
  S.b.locked=true; $('#chk').disabled=true;
  const full=`<span class="zh" style="font-size:32px">${s.t.join('')}</span><br>${s.t.map(pyOf).join(' ')}`;
  say(want);
  if(got===want){
    state.buildCount++; questAdd('build',1);
    const {x,mult}=reward(12);
    $('#fbx').innerHTML=`<div class="feedback ok">🧩 ${rnd(PRAISE)} +${x} ✨${mult>1?' 🔥 Комбо ×2!':''}<div class="mt">${full}</div></div>`;
    save(); autoNext(2200);
  } else {
    miss(); save();
    $('#fbx').innerHTML=`<div class="feedback no">Почти! Правильно так:<div class="mt">${full}</div><button class="btn mt" onclick="next()">Дальше →</button></div>`;
  }
}
function quitSession(){ if(confirm('Выйти из урока? Монстр убежит, но заработанный опыт и юани останутся.')){ save(); S=null; HW=null; screenHome(); } }
function finishSession(){
  const t=today(), dr=dayRec();
  if(state.lastSessionDay!==t){ state.streak = state.lastSessionDay===addDays(t,-1) ? state.streak+1 : 1; state.lastSessionDay=t; }
  state.bestStreak=Math.max(state.bestStreak,state.streak);
  let bonus=20+Math.min(state.streak,10)*2, coins=10;
  const acc=S.right/Math.max(1,S.right+S.wrong);
  if(S.wrong===0){ state.perfect++; coins+=10; }
  let bossWin=null;
  if(S.mode==='boss'){
    const u=UNITS[S.unitIdx].id; bossWin=acc>=0.8;
    if(bossWin){ if(!state.bosses[u]){ coins+=50; bonus+=60; } state.bosses[u]=true; }
  }
  let evMsg='';
  if(S.mode==='event'){
    const ev=EVENTS.find(e=>e.id===S.ev), key=evKey(ev);
    if(eventWords(ev).every(w=>boxOf(w)>=1) && !state.events[key]){
      state.events[key]=true; coins+=100; ev.rewards.forEach(id=>{ if(!state.owned.includes(id)) state.owned.push(id); });
      evMsg=`<div class="tip"><b>${ev.e} Праздник пройден!</b> Награда: ${ev.rewards.map(id=>shopItem(id).e+' '+shopItem(id).n).join(' + ')} + 100 💴 — надень в магазине!</div>`;
    }
  }
  addXP(bonus); S.xp+=bonus; addCoins(coins); S.coins+=coins; addEnergy(20);
  state.sessions++; dr.sessions++; dr.min+=Math.round((Date.now()-S.start)/60000);
  questAdd('lesson',1);
  state.msg=null; save(); backup();
  const li=levelInfo(), up=li.level>S.lvBefore, newItems=ITEMS.filter(i=>i.lv>S.lvBefore&&i.lv<=li.level);
  const evo=stageOf(li.level)>stageOf(S.lvBefore), stars=acc>=.9?3:acc>=.7?2:1;
  sfx.win(); if(bossWin!==false) confetti();
  const title = bossWin===false ? `Босс сбежал! ${S.monster}💨` : `Победа! ${S.monster}💥`;
  const sub = bossWin===false ? `Нужно 80% верных ответов, у тебя ${Math.round(acc*100)}%. Повтори слова и возвращайся — ты почти у цели!`
    : bossWin ? `Босс «${S.mname}» повержен! Следующая часть карты открыта 🗺️` : `${S.mname} повержен!`;
  app.innerHTML=`<div class="card center">
    <h1>${title}</h1><p class="muted">${sub}</p>
    <div style="font-size:48px;color:var(--gold)">${'★'.repeat(stars)}<span style="color:#e8dfcc">${'★'.repeat(3-stars)}</span></div>
    ${heroHTML()}
    ${evo?`<h2 class="mt">🌟 ЭВОЛЮЦИЯ! ${state.heroName} теперь «${stageTitle(hero(),stageOf(li.level))}»!</h2>`:up?`<h2 class="mt">⬆️ Новый уровень: ${li.level}!</h2>`:''}
    ${evMsg}${newItems.map(i=>`<div class="tip">Новое снаряжение: <b>${i.e} ${i.n}</b></div>`).join('')}
    ${HEROES.filter(h=>h.lock&&h.lock>S.lvBefore&&h.lock<=li.level).map(h=>`<div class="tip">🗝️ Открыт секретный герой: <b>${h.st[1]} ${h.name}</b>! Выбрать: «Родителям» → «Сменить героя».</div>`).join('')}
    <div class="stat-grid"><div class="stat"><b>+${S.xp}</b><span class="small muted">опыт</span></div>
      <div class="stat"><b>+${S.coins} 💴</b><span class="small muted">юаней</span></div>
      <div class="stat"><b>${Math.round(acc*100)}%</b><span class="small muted">точность</span></div></div>
    <p>🔥 ${state.streak} ${plural(state.streak,'день','дня','дней')} подряд · лучшее комбо: ${S.maxCombo} · энергия ${state.energy}/100</p>
    <button class="btn big" onclick="S=null;HW=null;screenHome()">На главную</button></div>`;
  checkAch();
}

  UNITS.forEach((u,i)=>{
    const ws=unitWords(i), got=ws.filter(w=>(state.words[w.id]||{}).box>=1).length, lock=i>=n, cur=i===n-1&&!state.bosses[u.id];
    const align=['flex-start','center','flex-end','center'][i%4];
    rows+=`<div class="node-row" style="justify-content:${align}"><button class="node ${lock?'lock':cur?'cur':got===ws.length?'done':''}" onclick="${lock?"toast('🔒 Победи предыдущего босса или закрепи слова прошлой темы')":"startSession()"}">
      ${cur?`<span class="here" style="left:-6px">${stageEmoji(hero(),stageOf(levelInfo().level))}</span>`:''}

}

function screenShop(){
  app.innerHTML=back('screenHome()','🛍️ Магазин')+
  `<p class="small muted">Юани 💴 даются за правильные ответы, уроки, боссов и сундуки.</p>
  <div class="card mt center">${heroHTML()}</div>`+
  Object.entries(SHOP_CATS).map(([cat,name])=>`<h3 class="mt2">${name}</h3><div class="shop">${SHOP.filter(s=>s.cat===cat).map(s=>{
    const own=state.owned.includes(s.id), on=state.eq[cat]===s.id;
    const evn=s.ev&&EVENTS.find(e=>e.id===s.ev);
    const btn = cat==='use' ? `<button class="btn" onclick="buy('${s.id}')">${s.price} 💴</button><div class="small muted">есть: ${state.freezes}/2</div>`
      : own ? `<button class="btn ${on?'ghost':'green'}" onclick="equip('${s.id}')">${on?'Снять':'Надеть'}</button>`
      : evn ? `<div class="small muted mt">🎁 Награда праздника «${evn.name}»</div>`
      : `<button class="btn" ${state.coins<s.price?'disabled':''} onclick="buy('${s.id}')">${s.price} 💴</button>`;
    return `<div class="item ${on?'on':''} ${s.rare?'rare':''}" style="${evn&&!own?'opacity:.6':''}">${s.rare?'<div class="small" style="color:var(--gold)">✨ легендарное</div>':''}<div class="e">${s.e}</div><b>${s.n}</b>${s.d?`<div class="small muted">${s.d}</div>`:''}<div>${btn}</div></div>`;
  }).join('')}</div>`).join('');
}
function buy(id){
  const s=shopItem(id); if(s.ev) return;
  if(state.coins<s.price){ toast(`Не хватает юаней: нужно ${s.price} 💴`); return; }
  if(id==='freeze'){ if(state.freezes>=2){ toast('Уже есть 2 заморозки — это максимум ❄️'); return; } state.freezes++; }
  else { state.owned.push(id); state.eq[s.cat]=id; }
  state.coins-=s.price; sfx.coin(); save(); toast(`Куплено: ${s.e} ${s.n}!`); checkAch(); screenShop();
}
function equip(id){ const s=shopItem(id); state.eq[s.cat]=state.eq[s.cat]===id?null:id; save(); screenShop(); }

function screenStories(){

function openStory(id){ ST={s:STORIES.find(x=>x.id===id),i:0,ok:0,q:0,answered:false}; renderStory(); }
const nameIn=s=>s.replace(/\{name\}/g,state.heroName);
function renderStory(){
  const s=ST.s, h=hero(), hs=stageEmoji(h,stageOf(levelInfo().level));
  const shown=s.lines.slice(0,ST.i+1);
  const chat=shown.map((l,j)=>{
    if(l[0]==='q') return '';
    const me=l[0]==='h';
    return `<div class="msg ${me?'me':''}"><span class="av">${me?hs:s.npc}</span><div class="bb" onclick="say('${l[1]}')">
      <div class="zh">${nameIn(l[1])}</div><div class="small">${nameIn(l[2])}</div><details onclick="event.stopPropagation()"><summary>перевод</summary>${nameIn(l[3])}</details></div></div>`;
  }).join('');
  const cur=s.lines[ST.i], end=ST.i>=s.lines.length-1;
  let bottom='';
  if(cur[0]==='q' && !ST.answered){
    const order=shuffle(cur[2].map((_,k)=>k));
    bottom=`<div class="tip"><b>❓ ${cur[1]}</b></div><div class="options one">${order.map(k=>`<button class="opt" data-k="${k}" onclick="storyAns(${k})">${cur[2][k]}</button>`).join('')}</div>`;
  } else if(!end){
    bottom=`<button class="btn big mt" onclick="ST.i++;ST.answered=false;renderStory();storySay()">Дальше →</button>`;
  } else {
    bottom=`<button class="btn green big mt" onclick="finishStory()">Конец истории 🎉</button>`;
  }
  app.innerHTML=back('screenStories()',s.title)+`<div class="card mt"><div class="small muted center">${s.npc} ${s.nn} и ${hs} ${state.heroName}</div><div class="chat">${chat}</div>${bottom}<div id="fbx"></div></div>`;
  window.scrollTo(0,document.body.scrollHeight);
}
function storySay(){ const l=ST.s.lines[ST.i]; if(l[0]!=='q') say(l[1]); }
function storyAns(k){
  const cur=ST.s.lines[ST.i], ok=k===cur[3]; ST.q++; if(ok) ST.ok++;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===cur[3])b.classList.add('right');else if(kk===k)b.classList.add('wrongc');});
  ok?sfx.ok():sfx.no();
  ST.answered=true;
  const end=ST.i>=ST.s.lines.length-1;
  $('#fbx').innerHTML=`<div class="feedback ${ok?'ok':'no'}">${ok?rnd(PRAISE):'Правильный ответ: '+cur[2][cur[3]]}
    <br><button class="btn mt" onclick="${end?'finishStory()':'ST.i++;ST.answered=false;renderStory();storySay()'}">Дальше →</button></div>`;
}
function finishStory(){
  const first=!state.stories[ST.s.id]; state.stories[ST.s.id]=true;
  const x=first?25:8, c=first?10:2; addXP(x); addCoins(c); addEnergy(5); questAdd('story',1); save(); sfx.win(); confetti();
  app.innerHTML=`<div class="card center"><div style="font-size:70px">📖</div><h1>История прочитана!</h1>
    <p>Вопросы: ${ST.ok}/${ST.q} ✅</p><p>+${x} ✨ +${c} 💴</p>
    <button class="btn big" onclick="screenStories()">К историям</button><button class="btn ghost big mt" onclick="screenHome()">На главную</button></div>`;
  checkAch();
}

function toneStart(){ T={round:0,total:8,ok:0}; toneRound(); }
function toneRound(){
  if(T.round>=T.total){
    const x=T.ok*5, c=Math.floor(T.ok/2); addXP(x); addCoins(c); addEnergy(T.ok); state.toneCorrect+=T.ok; save(); sfx.win(); if(T.ok>=6) confetti();
    app.innerHTML=`<div class="card center"><h1>🎵 Готово!</h1><h2 class="mt">Угадано ${T.ok} из ${T.total}</h2><p>+${x} ✨ +${c} 💴</p>
      <button class="btn big violet" onclick="toneStart()">Ещё раз</button><button class="btn ghost big mt" onclick="screenHome()">На главную</button></div>`;
    checkAch(); return;
  }
  const set=rnd(TONE_SETS), ti=Math.random()*4|0;
  T.cur={set,ti};
  app.innerHTML=`<div class="row between"><button class="icon-btn" onclick="screenTones()">✕</button><b>Раунд ${T.round+1}/${T.total}</b><span>✅ ${T.ok}</span></div>
  <div class="card mt center"><h2>Какой это тон?</h2><button class="speak mt" onclick="say('${set[ti][0]}',0.6)">🔊</button>
  <div class="options">${TONE_INFO.map((x,i)=>`<button class="opt" data-t="${i}" onclick="toneAns(${i})"><b class="t${x.t}" style="font-size:34px">${set[i][1]}</b><span class="small">${x.t} · ${x.name} ${x.mark}</span></button>`).join('')}</div><div id="fbx"></div></div>`;
  setTimeout(()=>say(set[ti][0],0.6),350);
}
function toneAns(i){
  const {set,ti}=T.cur, ok=i===ti;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const k=+b.dataset.t;if(k===ti)b.classList.add('right');else if(k===i)b.classList.add('wrongc');});
  if(ok){T.ok++;sfx.ok();questAdd('tone',1);save();}else sfx.no();
  $('#fbx').innerHTML=`<div class="feedback ${ok?'ok':'no'}">${ok?rnd(PRAISE):'Это был '+(ti+1)+'-й тон'}: <span class="zh">${set[ti][0]}</span> ${set[ti][1]} — ${set[ti][2]}
    <br><button class="btn mt" onclick="T.round++;toneRound()">Дальше →</button></div>`;
}

/* =========================================================
   ПРОПИСИ: Hanzi Writer (порядок черт + проверка), без интернета — обводка
   ========================================================= */
const WRITE_BASE='一二三十人口日月山大小木水火';
let WR={ch:null,drew:false};
function writeChars(){ const s=new Set([...WRITE_BASE]); Object.keys(state.words).forEach(id=>[...WBY[id].h].forEach(c=>s.add(c))); return [...s]; }
function charInfo(c){ return WORDS.find(w=>w.h===c)||WORDS.find(w=>w.h.includes(c)); }
function writeReward(mistakes){
  state.writeCount++; questAdd('write',1); const dr=dayRec(); dr.wxp=dr.wxp||0;
  let msg=mistakes===0?'Идеально! 🖌️':rnd(PRAISE);
  if(dr.wxp<40){ addXP(5); addCoins(1); dr.wxp+=5; addEnergy(1); msg+=' +5 ✨ +1 💴'; }
  sfx.ok(); toast(msg); save(); checkAch();
}
function nextWriteChar(){ const list=writeChars(), i=list.indexOf(WR.ch); setTimeout(()=>screenWrite(list[(i+1)%list.length]),1300); }
function screenWrite(ch,forceCanvas){
  const list=writeChars(); WR.ch=ch||WR.ch||list[0]; WR.drew=false;
  const w=charInfo(WR.ch), smart=!!window.HanziWriter&&!forceCanvas;
  app.innerHTML=back('screenHome()','✍️ Прописи')+`
  <div class="card mt center">
    <div class="chips">${list.map(c=>`<button class="chip zh ${c===WR.ch?'sel':''}" onclick="screenWrite('${c}')">${c}</button>`).join('')}</div>
    ${w?`<p class="mt">${w.h===WR.ch?`<b>${cpy(w.p)}</b> — ${w.ru} ${w.e}`:`из слова <span class="zh">${w.h}</span> (${w.ru})`}</p>`:''}
    <div class="pad" id="pad">${GRID}${smart?'<div id="hw"></div>':`<div class="trace kai">${WR.ch}</div><canvas id="cv"></canvas>`}</div>
    <div class="small muted">${smart?'Посмотри, как пишется, потом пиши сам черту за чертой. Ошибёшься — подскажу!':'Обведи иероглиф пальцем или мышкой. Черты пишем сверху вниз и слева направо.'}</div>
    <div class="row cen mt wrap">${smart?'<button class="icon-btn" onclick="hwDemo()">▶ Как писать</button><button class="icon-btn" onclick="HW&&(HW.cancelQuiz(),hwQuiz())">🔁 Заново</button>'
      :'<button class="icon-btn" onclick="clearPad()">🧽 Стереть</button><button class="btn green" onclick="writeDone()">Готово ✓</button>'}
      <button class="icon-btn" onclick="say('${WR.ch}')">🔊</button></div>
  </div>`;
  if(smart) mountWriter(WR.ch,m=>{ if(m===null){ screenWrite(WR.ch,true); return; } writeReward(m); nextWriteChar(); });
  else setupPad();
}
function setupPad(){
  const cv=$('#cv'), r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr);
  g.lineCap='round'; g.lineJoin='round'; g.lineWidth=r.width/22; g.strokeStyle='#2b2350';
  let down=false;
  const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);g.beginPath();g.moveTo(x,y);g.lineTo(x+.1,y+.1);g.stroke();WR.drew=true;};
  cv.onpointermove=e=>{if(!down)return;const [x,y]=pos(e);g.lineTo(x,y);g.stroke();};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;};
}
function clearPad(){ const cv=$('#cv'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); WR.drew=false; }
function writeDone(){ if(!WR.drew){ toast('Сначала обведи иероглиф ✍️'); return; } writeReward(1); nextWriteChar(); }

  ${UNITS.map((u,i)=>{const ws=unitWords(i);const got=ws.filter(w=>(state.words[w.id]||{}).box>=1).length;const locked=i>=n;
    return `<div class="card unit ${locked?'locked':''}"><div class="row between"><h3>${u.icon} ${u.name}${u.hsk?` <span class="hsk">HSK ${u.hsk}</span>`:''}</h3><span class="small">${locked?'🔒 откроется позже':`${got}/${ws.length}`}</span></div>
    ${locked?'':`<div class="words">${ws.map(w=>{const r=state.words[w.id];return `<button class="w" onclick="say('${w.h}')"><div class="hz zh">${r?chz(w.h,w.p):'？'}</div><div class="small">${r?cpy(w.p):''}</div><div>${r?w.e+' '+w.ru:'<span class=muted>ещё не изучено</span>'}</div><div class="stars">${r?'★'.repeat(r.box)+'<span style="color:#e8dfcc">'+'★'.repeat(5-r.box)+'</span>':''}</div></button>`}).join('')}</div>`}</div>`}).join('')}
  ${(()=>{const ws=WORDS.filter(w=>w.ev&&state.words[w.id]);return ws.length?`<div class="card unit"><h3>🏮 Праздничные слова</h3><div class="words">${ws.map(w=>`<button class="w" onclick="say('${w.h}')"><div class="hz zh">${chz(w.h,w.p)}</div><div class="small">${cpy(w.p)}</div><div>${w.e} ${w.ru}</div></button>`).join('')}</div></div>`:''})()}`;
}
/* =========================================================
   ПРОВЕРКА МИКРОФОНА: пошаговая диагностика с подсказками для Safari
   ========================================================= */
let MC={};
function screenMic(from){
  MC.from=from||MC.from||'parent';
  const isSafari=/Safari/.test(navigator.userAgent)&&!/Chrome|Chromium|Edg/.test(navigator.userAgent);
  const row=(ok,title,body)=>`<div class="check"><span class="st">${ok===true?'✅':ok===false?'❌':'⬜'}</span><div><b>${title}</b>${body?`<div class="small mt">${body}</div>`:''}</div></div>`;
  const safariSite=`В верхнем меню Mac: <b>Safari → Настройки для «${location.hostname}»…</b> → в строке <b>Микрофон</b> выберите <b>«Разрешить»</b>. Затем нажмите «Проверить» ещё раз.`;
  const macMic=`Откройте <b>Системные настройки → Конфиденциальность и безопасность → Микрофон</b> и включите переключатель у <b>${isSafari?'Safari':'вашего браузера'}</b>. Браузер попросит перезапуститься — согласитесь, затем снова откройте тренажёр по ссылке.`;
  const macSR=isSafari?`На этом Mac Safari распознаёт только русскую речь, китайскую — нет. <b>Откройте тренажёр в Google Chrome</b> по той же ссылке <b>${location.host}${location.pathname}</b> — там китайский распознаётся сразу. Прогресс перенесите так: здесь в Safari «👨‍👩‍👧 Родителям» → «💾 Сохранить в файл», а в Chrome — «📂 Загрузить из файла».`:`Откройте <b>Системные настройки → Конфиденциальность и безопасность → Распознавание речи</b> и включите <b>${isSafari?'Safari':'браузер'}</b>. Если Safari там нет: <b>Системные настройки → Клавиатура → Диктовка</b> — включите диктовку. Затем перезапустите Safari.`;
  app.innerHTML=back(MC.from==='lesson'?'S?renderTask():screenHome()':MC.from==='parent'?'screenParent()':'screenHome()','🎤 Микрофон')+`
  <div class="card mt"><p style="margin-top:0">Проверим по шагам, что мешает. Компьютер сам покажет, где нажать.</p>
    ${row(ON_SERVER,'1. Тренажёр открыт правильно', ON_SERVER?'Тренажёр открыт по ссылке — микрофону можно работать.':'Сейчас тренажёр открыт как файл. Закройте эту вкладку и дважды щёлкните «Запустить тренажер.command» в папке тренажёра.')}
    ${row(!!SR,'2. Браузер умеет распознавать речь', SR?'':'Этот браузер не умеет. Используйте Safari или Chrome.')}
    ${row(MC.mic,'3. Доступ к микрофону', MC.mic===false?(MC.micErr==='NotFoundError'?'Микрофон не найден. Подключите наушники с микрофоном или проверьте встроенный.':`Safari не дал доступ. ${safariSite}<br><br>Если окна с вопросом не было вообще: ${macMic}`):MC.mic?'Микрофон работает!':'Нажмите кнопку ниже. Браузер спросит: «Разрешить использовать микрофон?» — нажмите <b>«Разрешить»</b>.')}
    ${row(MC.sr,'4. Распознавание китайской речи', MC.sr===false?(MC.srErr==='not-allowed'||MC.srErr==='service-not-allowed'?macSR:MC.srErr==='no-speech'?'Ничего не услышал — нажмите ещё раз и скажите «你好» (ни хао) погромче.':`Ошибка: ${MC.srErr}. Попробуйте ещё раз.`):MC.sr?`Услышал: <span class="zh">${MC.heard}</span> — всё работает! 🎉`:'После шага 3 нажмите «Скажи 你好» и произнесите «ни хао».')}
    <div class="row wrap mt">
      <button class="btn" ${ON_SERVER?'':'disabled'} onclick="micStep3()">🎤 Проверить доступ</button>
      <button class="btn violet" ${MC.mic?'':'disabled'} onclick="micStep4()">🗣️ Скажи 你好</button>
    </div>
    ${MC.sr?`<button class="btn green big mt" onclick="state.settings.speak=true;save();${MC.from==='lesson'?'S?renderTask():screenHome()':'screenHome()'}">Готово — можно заниматься! 🎉</button>`:''}
  </div>
  <p class="small muted">Если всё равно не получается, кнопка «🙊 Не могу сейчас говорить» в уроке просто пропустит задания на произношение — без штрафов.</p>`;
}
async function micStep3(){ const r=await ensureMic(); MC.mic=r===true; MC.micErr=r===true?null:r; screenMic(); }
function micStep4(){
  const b=document.querySelectorAll('.btn.violet')[0]; if(b){ b.textContent='Слушаю… скажи «ни хао»'; b.disabled=true; }
  listen((alts,err)=>{ if(err){ MC.sr=false; MC.srErr=err; } else { MC.heard=alts[0]||''; MC.sr=!!MC.heard; MC.srErr=MC.heard?null:'no-speech'; } screenMic(); });
}
function screenAch(){
  const li=levelInfo(),h=hero();
  app.innerHTML=back('screenHome()','🏆 Награды')+`
  <h3 class="mt">Эволюция героя</h3>
  <div class="card mt row wrap" style="justify-content:space-around">${STAGE_LV.map((lv,i)=>{const got=stageOf(li.level)>=i;return `<div class="center ${i>=5?LEGEND[i-5].c:''}" style="opacity:${got?1:.3};width:96px"><div class="hero-emoji" style="position:static;font-size:44px">${got?stageEmoji(h,i):'❓'}</div><div class="small">${i>=5?LEGEND[i-5].n:h.ti[i]}</div><div class="small muted">ур. ${lv}</div></div>`}).join('')}</div>
  <h3 class="mt2">Секретные герои</h3>
  <div class="ach mt">${HEROES.filter(x=>x.lock).map(x=>`<div class="a ${heroLocked(x)?'off':''}"><div class="e">${heroLocked(x)?'🔒':x.st[1]}</div><b>${x.name}</b><div class="small muted">уровень ${x.lock}</div></div>`).join('')}</div>
  <h3 class="mt2">Снаряжение</h3>
  <div class="ach mt">${ITEMS.map(i=>`<div class="a ${li.level>=i.lv?'':'off'}"><div class="e">${i.e}</div><b>${i.n}</b><div class="small muted">уровень ${i.lv}</div></div>`).join('')}</div>
  <h3 class="mt2">Медали</h3>
  <div class="ach mt">${ACH.map(a=>`<div class="a ${state.ach.includes(a.id)?'':'off'}"><div class="e">${a.e}</div><b>${a.n}</b><div class="small muted">${a.d}</div></div>`).join('')}</div>`;
}

/* =========================================================
   РОДИТЕЛЯМ
   ========================================================= */
function screenParentGate(){
  const a=6+(Math.random()*4|0), b=6+(Math.random()*4|0);
  app.innerHTML=back('screenHome()','Для взрослых')+`
  <div class="card mt center"><p>Решите пример, чтобы войти:</p><h2>${a} × ${b} = ?</h2>
  <input id="pg" type="number" inputmode="numeric" style="max-width:180px;text-align:center" class="mt"><br>
  <button class="btn mt" onclick="($('#pg').value==${a*b})?screenParent():toast('Неверно')">Войти</button></div>`;
}
function screenParent(){
  const days=[...Array(14)].map((_,i)=>addDays(today(),i-13));
  const maxXP=Math.max(20,...days.map(d=>(state.days[d]||{}).xp||0));
  const tot=Object.values(state.days).reduce((a,d)=>({c:a.c+d.correct,w:a.w+d.wrong,m:a.m+d.min}),{c:0,w:0,m:0});
  const hard=Object.entries(state.words).filter(([,r])=>r.w>0).sort((a,b)=>b[1].w-a[1].w).slice(0,8);
  app.innerHTML=back('screenHome()','👨‍👩‍👧 Родителям')+`
  ${zhVoice?'':`<div class="card mt tip"><b>⚠️ Не найден китайский голос.</b> На Mac: Системные настройки → Универсальный доступ → Устный контент → Системный голос → Управлять голосами → Китайский (Tingting). В Windows: Параметры → Время и язык → Речь → добавить «Китайский (упрощ.)». Лучше всего работает в Chrome или Safari.</div>`}
  ${SR?'':`<div class="card mt tip"><b>🎤 Этот браузер не умеет распознавать речь</b> — упражнения на говорение отключены. Откройте тренажёр в Chrome или Safari.</div>`}
  <div class="card mt"><h3>Статистика</h3>
    <div class="stat-grid"><div class="stat"><b>${state.sessions}</b><span class="small muted">уроков</span></div>
    <div class="stat"><b>${learnedCount()}/${COURSE.length}</b><span class="small muted">слов изучено</span></div>
    <div class="stat"><b>${Object.values(state.words).filter(r=>r.box>=4).length}</b><span class="small muted">слов в долгой памяти</span></div>
    <div class="stat"><b>${tot.c+tot.w?Math.round(tot.c/(tot.c+tot.w)*100):0}%</b><span class="small muted">точность</span></div>
    <div class="stat"><b>${state.bestStreak}</b><span class="small muted">рекорд дней подряд</span></div>
    <div class="stat"><b>${tot.m}</b><span class="small muted">минут всего</span></div>
    <div class="stat"><b>${state.speakCount}</b><span class="small muted">слов сказано</span></div>
    <div class="stat"><b>${state.writeCount}</b><span class="small muted">иероглифов написано</span></div>
    <div class="stat"><b>${Object.keys(state.bosses).length}/${UNITS.length}</b><span class="small muted">боссов побеждено</span></div></div>
    <p class="small muted mt">Опыт по дням (последние 14 дней):</p>
    <div class="chart">${days.map(d=>{const x=(state.days[d]||{}).xp||0;return `<div class="${x?'':'zero'}" title="${d}: ${x} XP" style="height:${x/maxXP*100}%"></div>`}).join('')}</div>
    <div class="row between small muted"><span>${days[0].slice(5)}</span><span>сегодня</span></div>
    ${hard.length?`<h3 class="mt2">Трудные слова</h3><table>${hard.map(([id,r])=>{const w=WBY[id];return `<tr><td class="zh" style="font-size:22px">${w.h}</td><td>${w.p}</td><td>${w.ru}</td><td>❌ ${r.w} / ✅ ${r.c}</td></tr>`}).join('')}</table>`:''}
  </div>
  <div class="card mt"><h3>Настройки</h3>
    <label class="setting">Скорость речи <input type="range" min="0.5" max="1" step="0.05" value="${state.settings.rate}" oninput="state.settings.rate=+this.value;save()" onchange="say('你好，我是你的老师')"></label>
    <label class="setting">Новых слов за урок
      <select onchange="state.settings.newPerSession=+this.value;save()" style="font:inherit;font-size:18px;padding:6px;border-radius:10px">${[2,3,4,5,6].map(n=>`<option ${n===state.settings.newPerSession?'selected':''}>${n}</option>`).join('')}</select></label>
    <label class="setting">Ступень сложности <select onchange="state.settings.step=+this.value;save()" style="font:inherit;font-size:16px;padding:6px;border-radius:10px">
      <option value="0" ${!state.settings.step?'selected':''}>Авто (сейчас ${autoStep()})</option>${[1,2,3,4].map(n=>`<option value="${n}" ${state.settings.step===n?'selected':''}>${n} — ${STEPS[n]}</option>`).join('')}</select></label>
    <label class="setting">🎤 Микрофон для произношения <button class="btn violet" style="padding:8px 14px;font-size:16px" onclick="screenMic('parent')">Проверить и включить</button></label>
    <label class="setting">Упражнения на говорение (микрофон) <input type="checkbox" ${state.settings.speak?'checked':''} ${SR?'':'disabled'} onchange="state.settings.speak=this.checked;save()" style="width:26px;height:26px"></label>
    <label class="setting">Открыть все темы сразу <input type="checkbox" ${state.settings.allOpen?'checked':''} onchange="state.settings.allOpen=this.checked;save()" style="width:26px;height:26px"></label>
    <label class="setting">Сменить героя или имя <button class="icon-btn" onclick="screenStart()">Изменить</button></label>
  </div>
  <div class="card mt"><h3>Резервная копия прогресса</h3>
    <p class="small ${ON_SERVER&&serverSaved!==false?'':'muted'}">${!HAS_API&&ON_SERVER
      ? '✅ Прогресс сохраняется автоматически в этом браузере на этом устройстве. Занимайтесь всегда в одном и том же браузере. Для надёжности раз в неделю нажимайте «Сохранить в файл».'
      : ON_SERVER
      ? (serverSaved===false?'⚠️ Не удалось сохранить в файл — проверьте, что окно Терминала тренажёра открыто.':'✅ Прогресс автоматически сохраняется в файл <b>progress.json</b> в папке тренажёра, а копии за последние 30 дней — в папке <b>progress-backups</b>. Он не зависит от браузера.')
      : '⚠️ Тренажёр открыт как файл: прогресс хранится только в этом браузере. Запускайте его через «Запустить тренажер.command».'}</p>
    <p class="small muted">Файл-копия ниже нужен, чтобы перенести прогресс на другой компьютер.</p>
    <div class="row wrap"><button class="btn violet" onclick="exportData()">💾 Сохранить в файл</button>
    <label class="btn ghost">📂 Загрузить из файла<input type="file" accept=".json" hidden onchange="importData(this.files[0])"></label></div>
    <button class="icon-btn mt" style="color:var(--red)" onclick="resetAll()">Сбросить весь прогресс</button>
  </div>
  <div class="card mt"><h3>Как устроен тренажёр</h3>
    <details><summary>Методика (коротко)</summary><ul class="small">
      <li><b>Короткие уроки (~10 мин) каждый день</b> — для 8 лет регулярность важнее длительности.</li>
      <li><b>Интервальные повторения (коробки Лейтнера)</b>: слово повторяется через 1, 2, 4, 7, 15 дней. Ошибка возвращает его в начало.</li>
      <li><b>Не больше 4 новых слов за урок</b> и сразу активное вспоминание (тесты), а не пассивное чтение.</li>
      <li><b>Все четыре навыка</b>: слушать (аудио), говорить (микрофон), читать (иероглифы, истории), писать (порядок черт с проверкой).</li>
      <li><b>Сборка фраз из плиток</b> — грамматика без правил: ребёнок сам видит порядок слов «я + люблю + маму».</li>
      <li><b>Истории</b> — слова в живом диалоге с вопросами на понимание.</li>
      <li><b>Цветные тоны</b>: 1 — красный, 2 — оранжевый, 3 — зелёный, 4 — синий, лёгкий — серый.</li>
      <li><b>Ошибки не наказываются</b>: без таймеров и «жизней», ошибочное слово повторяется в конце урока и попадает в «Работу над ошибками».</li>
    </ul></details>
    <details><summary>Игровая механика</summary><ul class="small">
      <li>Опыт → уровни → снаряжение и 5 стадий эволюции героя.</li>
      <li>Энергия растёт от занятий; <b>каждый пропущенный день −20 энергии</b> и сброс серии — если нет ❄️ заморозки.</li>
      <li>Юани 💴 за ответы, уроки, боссов и сундуки → магазин: питомцы, фоны, ауры, заморозки.</li>
      <li>3 задания дня → сундук. Комбо: 5 верных подряд = опыт ×2.</li>
      <li>Карта тем с боссами: победа над боссом (80% верных) сразу открывает следующую тему.</li>
      <li>Уровни и предметы никогда не отнимаются — чтобы не рушить мотивацию.</li>
    </ul></details>
    <details><summary>Что нужно для работы</summary><ul class="small">
      <li>Интернет — для анимации порядка черт (без него прописи работают в режиме обводки).</li>
      <li>Микрофон и Chrome/Safari — для упражнений на говорение.</li>
    </ul></details>
  </div>`;
}
function exportData(){
  const b=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`kitaiskiy-progress-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importData(f){
  if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d||typeof d.xp!=='number') throw 0;
    const merge=hasProgress(state)&&confirm('Объединить с текущим прогрессом?\nОК — сложить оба прогресса (ничего не потеряется)\nОтмена — заменить текущий прогресс загруженным');
    state=merge?mergeState(state,d):normalize(d); save(); backup(); toast(merge?'Прогресс объединён ✅':'Прогресс загружен ✅'); screenHome(); }catch(e){ toast('Не получилось прочитать файл'); } };
  rd.readAsText(f);
}
function resetAll(){ if(confirm('Точно стереть весь прогресс?') && confirm('Это нельзя отменить. Стереть?')){ localStorage.removeItem(KEY); localStorage.removeItem(KEY+'-backup'); state=fresh(); save(); screenStart(); } }

/* старт */
load();
syncOnStart().then(()=>{ applyDecay(); if(location.hash==='#mic'&&state.heroId){ history.replaceState(null,'',location.pathname); screenMic('home'); } else screenHome(); });
window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} if(HAS_API) pushServer(true); });
</script>
